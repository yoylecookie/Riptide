<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Riptide - Music Player</title>


<style>

body {

    background-image:url("https://file.garden/Z_Zkhskjxktxt43S/Riptide/bg.png");
    background-size:cover;
    background-attachment:fixed;

    font-family:sans-serif;
    text-align:center;
    color:white;

}


h1 {

    font-size:50px;

}


input {

    width:60%;
    height:35px;

    border-radius:40px;
    border:none;

    padding-left:20px;

    font-size:16px;

}


button {

    margin:20px;

    width:120px;
    height:35px;

    border-radius:40px;

    border:none;

    background:#5791de;

    color:white;

    cursor:pointer;

}


button:hover {

    transform:scale(1.1);

}



.player {

    width:700px;

    margin:30px auto;

    padding:25px;

    border-radius:25px;

    background:#0008;

    backdrop-filter:blur(10px);

    display:flex;

    gap:30px;

    align-items:center;

}



.player img {

    width:200px;

    height:200px;

    object-fit:cover;

    border-radius:20px;

}



.info {

    text-align:left;

}



.info h2 {

    margin:0;

    font-size:35px;

}



.songlist {

    width:650px;

    margin:auto;

}



.song {

    background:#ffffff22;

    padding:15px;

    margin:10px;

    border-radius:15px;

    cursor:pointer;

    text-align:left;

}



.song:hover {

    background:#ffffff44;

}



audio {

    width:300px;

}



</style>


</head>



<body>


<img src="https://file.garden/Z_Zkhskjxktxt43S/Riptide/riptide%20logo.png" width="550px" style="margin-bottom:60px; margin-top:20px;">

<br>

<input id="code" placeholder="Enter Riptide Code">


<br>


<button onclick="loadAlbum()">
Find
</button>



<div id="album"></div>

<a href="docs/create.html" style="color:white;">Create a Riptide Playlist!</a>

<script>


const prefix = "https://file.garden/";

const alphabet =
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";


let songs = [];

let audio;



function decodeText(text) {


    let bits = "";


    for(let c of text) {


        let value = alphabet.indexOf(c);


        if(value < 0) {

            throw "Invalid code";

        }


        bits += value.toString(2).padStart(6,"0");


    }



    let bytes = [];



    for(let i = 0; i + 8 <= bits.length; i += 8) {


        bytes.push(
            parseInt(bits.substring(i,i+8),2)
        );


    }



    return new TextDecoder()
    .decode(new Uint8Array(bytes));


}





async function loadAlbum() {


    try {


        let code =
        document.getElementById("code").value;



        let path =
        decodeText(code);



        let root =
        prefix + path;



        let response =
        await fetch(
            root + "riptide.json?t=" + Date.now()
        );



        let data =
        await response.json();



        songs = [];



        for(let i = 1; i <= data.Amount; i++) {


            songs.push(
                data[i][0]
            );


        }




        document.getElementById("album").innerHTML = `


        <div class="player">


            <img id="cover" src="${songs[0].Cover}">



            <div class="info">


                <h2 id="title">
                ${songs[0].Name}
                </h2>



                <p id="author">
                ${songs[0].Author}
                </p>



                <audio id="audio" controls>

                    <source src="${songs[0].URL}">

                </audio>



            </div>


        </div>



        <h2>Songs</h2>


        <div class="songlist" id="songlist"></div>


        `;




        audio =
        document.getElementById("audio");



        let list =
        document.getElementById("songlist");



        songs.forEach((song,index)=>{


            list.innerHTML += `


            <div class="song"
            onclick="playSong(${index})">


            🎵 ${song.Name}


            <br>


            <small>
            ${song.Author}
            </small>


            </div>


            `;


        });



    }


    catch(error) {


        alert(
        "Riptide error: " + error
        );


        console.log(error);


    }


}





function playSong(index) {


    let song =
    songs[index];



    document.getElementById("cover").src =
    song.Cover;



    document.getElementById("title").innerText =
    song.Name;



    document.getElementById("author").innerText =
    song.Author;



    audio.src =
    song.URL;



    audio.play();


}



</script>


</body>

</html>
